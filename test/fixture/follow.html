<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>follow-sim</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
  #scroller { height: 600px; width: 800px; overflow-y: auto; border: 1px solid #ddd; }
  .turn { min-height: 120px; border-bottom: 1px dashed #eee; padding: 8px; }
  #out { position: fixed; right: 8px; top: 8px; padding: 8px; background: white; white-space: pre-wrap; }
</style>
<script>
  window.__ModuleLoader__ = { load(definition) { window.__def = definition } }
</script>
<script src="../../client.js"></script>
</head>
<body>
<div id="scroller" data-conversation-scroll><div id="content"></div></div>
<div class="toBottomSlot"><button id="toBottom">bottom</button></div>
<pre id="out">running...</pre>
<script>
const results = []
const check = (name, ok) => results.push((ok ? 'PASS ' : 'FAIL ') + name)
const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
const scroller = document.getElementById('scroller')
const content = document.getElementById('content')
const toBottom = document.getElementById('toBottom')
const floor = () => scroller.scrollHeight - scroller.clientHeight
let clicks = 0

toBottom.addEventListener('click', () => { clicks++; scroller.scrollTop = floor() })
function appendTurn() {
  const turn = document.createElement('div')
  turn.className = 'turn'
  turn.textContent = 'streamed output '.repeat(60)
  content.append(turn)
}

for (let i = 0; i < 6; i++) appendTurn()
scroller.scrollTop = floor()
const { createFollowController } = window.__def.factory(() => ({})).__internals
const controller = createFollowController({ document, window, performance, MutationObserver })
const stop = controller.start()

;(async () => {
  try {
    check('starts at the tail', controller.state.mode === 'follow')
    appendTurn()
    await wait(500)
    check('follows output without clicking', floor() - scroller.scrollTop <= 1 && clicks === 0)

    scroller.dispatchEvent(new WheelEvent('wheel', { deltaY: -10, bubbles: true }))
    scroller.scrollTop -= 10
    await wait(30)
    const readingTop = scroller.scrollTop
    appendTurn()
    await wait(800)
    check('keeps a small upward scroll after further growth', scroller.scrollTop === readingTop && controller.state.mode === 'reading' && clicks === 0)

    toBottom.click()
    await wait(60)
    appendTurn()
    await wait(500)
    check('manual return restores legacy follow', floor() - scroller.scrollTop <= 1 && controller.state.mode === 'follow' && clicks === 1)

    const beforeHandoff = scroller.scrollTop
    const spacer = document.createElement('div')
    spacer.setAttribute('data-chat-turn-spacer', '')
    scroller.append(spacer)
    appendTurn()
    await wait(500)
    check('late native marker stops plugin writes', controller.state.native && scroller.scrollTop === beforeHandoff && clicks === 1)
  } catch (error) {
    results.push('ERROR ' + error)
  } finally {
    document.getElementById('out').textContent = results.join('\n')
    document.title = results.every(line => line.startsWith('PASS')) ? 'ALL-PASS' : 'HAS-FAIL'
    stop()
  }
})()
</script>
</body></html>
